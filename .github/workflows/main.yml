name: BMI Calculator CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2 

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.23.1
    
      - name: List files in the calculate directory
        run: ls -la ./calculate
        
      - name: Install dependencies
        run: go get -u github.com/gin-gonic/gin
        working-directory: ./calculate

      - name: Go mod tidy
        run: go mod tidy
        working-directory: ./calculate

      - name: Run tests
        run: go test -v ./...
        working-directory: ./calculate
