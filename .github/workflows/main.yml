name: BMI Calculator CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Set up Go
              uses: actions/setup-go@v2
              with:
                  go-version: 1.23.1
            
            - name: install dependencies
              run: go get -u github.com/gin-gonic/gin
              working-directory: calculate

            - name: go mod tidy
              run: go mod tidy
              working-directory: calculate
            
            - name: run tests
              run: go test -v ./...
              working-directory: calculate
