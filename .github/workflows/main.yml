name: BMI Calculator CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Set up Go
              uses: actions/setup-go@v2
              with:
                  go-version: 1.23.1

            - name: go mod tidy
              run: |
                  cd calculate
                  go mod tidy
            
            - name: run tests
              run: |
                  cd calculate
                  go test -v ./...
